worker_processes auto;
rtmp_auto_push on;
events {}

rtmp {
  server {
    listen 1935;
    chunk_size 4096;

    application live {
      live on;
      record off;

      # Enable HLS
      hls on;
      hls_path /tmp/hls;
      hls_fragment 2s;
      hls_playlist_length 6s;
      hls_cleanup on;
      # hls_continuous on; # Optional, keeping it simple as per requirements
    }
  }
}

http {
  sendfile off;
  tcp_nopush on;
  directio 512;
  default_type application/octet-stream;

  server {
    listen 80;
    server_name _;

    # Serve the player page
    location / {
      root /www;
      index index.html;
    }

    # Serve HLS assets
    location /hls/ {
      types {
        application/vnd.apple.mpegurl m3u8;
        video/mp2t ts;
      }
      root /tmp;
      add_header Cache-Control no-cache;
      add_header Access-Control-Allow-Origin *;
    }
  }
}
