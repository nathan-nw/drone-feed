<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Drone Live Stream</title>
    <style>
      body { font-family: sans-serif; padding: 20px; background: #f0f0f0; }
      .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
      h1 { margin-top: 0; }
      video { width: 100%; background: black; border-radius: 4px; margin-top: 10px; }
      .status { margin-top: 10px; padding: 10px; background: #eef; border-radius: 4px; font-family: monospace; }
      code { background: #eee; padding: 2px 4px; border-radius: 3px; }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Drone Live Stream</h1>
      <p>
        <strong>Ingest:</strong> <code>rtmp://&lt;HOST_IP&gt;:1935/live/drone</code><br>
        <strong>Playback (WebRTC):</strong> this page
      </p>

      <div style="position: relative; padding-top: 56.25%; border-radius: 4px; overflow: hidden; background: black; margin-top: 10px;">
        <iframe
          id="webrtcFrame"
          allow="autoplay; fullscreen"
          style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0;"
        ></iframe>
      </div>

      <div id="status" class="status">Initializing...</div>
    </div>

    <script>
      const status = document.getElementById('status');
      const frame = document.getElementById('webrtcFrame');

      function log(msg) {
        status.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
        console.log(msg);
      }

      const host = window.location.hostname || 'localhost';
      const webrtcUrl = `http://${host}:8889/drone`;

      frame.src = webrtcUrl;
      frame.onload = () => {
        log(`WebRTC player loaded from ${webrtcUrl}`);
      };
      frame.onerror = () => {
        log(`Failed to load WebRTC player at ${webrtcUrl}`);
      };
    </script>
  </body>
</html>
