version: "3.8"
services:
  rtmp:
    image: tiangolo/nginx-rtmp:latest
    # Removed container_name to avoid conflicts
    ports:
      - "1935:1935"
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./web:/www:ro
      - ./data/hls:/tmp/hls
    restart: unless-stopped
